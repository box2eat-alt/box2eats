<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Seating Plan — Boxing Match</title>
<style>
  :root{
    --ink:#1a1a1a;
    --line:#222;
    --chair:#fff;
    --chair-border:#333;
    --table:#eceff3;
    --table-border:#555;
    --label:#222;
    --paper:#ffffff;
    --wall:#111;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#cdd2d8;
    font-family:"Arial Narrow",Arial,Helvetica,sans-serif;
    color:var(--ink);
    padding:24px;
  }
  .sheet-wrap{
    overflow:auto;
    -webkit-overflow-scrolling:touch;
  }
  /* The whole venue is drawn at a fixed design size, then scaled to fit */
  .venue{
    position:relative;
    width:1500px;
    height:850px;
    margin:0 auto;
    background:var(--paper);
    border:6px solid var(--wall);
    border-radius:4px;
    transform-origin:top center;
  }
  /* ---------- Dimension label top ---------- */
  .top-dim{
    position:absolute; top:-22px; left:0; right:0;
    text-align:center; font-size:15px; letter-spacing:2px;
    color:#000;
  }

  /* ---------- Exits ---------- */
  .exit{
    position:absolute;
    width:54px; height:30px;
    display:flex; align-items:center; justify-content:center;
    background:#fff; border:2px solid #c0392b;
    color:#c0392b; font-weight:bold; font-size:12px;
    letter-spacing:1px; z-index:5;
  }
  .exit::before,.exit::after{
    content:""; position:absolute; width:14px; height:22px;
    border:2px solid #c0392b; border-radius:50%;
  }
  .exit::before{ left:-16px; border-right:none; }
  .exit::after{ right:-16px; border-left:none; }

  /* ---------- Seating blocks ---------- */
  .block{ position:absolute; }
  .block .col-head{
    display:flex; justify-content:space-between;
    font-size:12px; font-weight:bold; padding:0 2px 3px;
  }
  .block .caption{
    text-align:center; font-size:13px; font-weight:bold;
    letter-spacing:.5px; margin-bottom:6px;
  }
  .block .caption-bottom{
    text-align:center; font-size:13px; font-weight:bold;
    letter-spacing:.5px; margin-top:6px;
  }
  .row{ display:flex; align-items:center; margin-bottom:5px; }
  .row .rownum{ width:14px; font-size:11px; font-weight:bold; text-align:right; margin-right:6px; }
  .seats{ display:flex; gap:1px; }
  .aisle{ width:30px; }
  .chair{
    width:16px; height:26px;
    background:var(--chair);
    border:1.2px solid var(--chair-border);
    border-radius:2px 2px 0 0;
    position:relative;
  }
  /* little seat-back tick */
  .chair::after{
    content:""; position:absolute; left:2px; right:2px; top:2px;
    height:3px; border-top:1px solid #999;
  }
  /* empty placeholder where a seat column was deleted (keeps spacing) */
  .chair-gap{ width:16px; height:26px; visibility:hidden; }

  /* ---------- Fire aisle ---------- */
  .fire-aisle{
    position:absolute;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    border-top:1.5px solid #000; border-bottom:1.5px solid #000;
    font-weight:bold;
  }
  .fire-aisle .ttl{ font-size:16px; letter-spacing:1px; }
  .fire-aisle .sub{ font-size:12px; display:flex; align-items:center; gap:6px; }
  .fire-aisle .arrow{ font-size:14px; }

  /* ---------- Tables ---------- */
  .table{
    position:absolute;
    background:var(--table);
    border:1.5px solid var(--table-border);
    display:flex; align-items:center; justify-content:center;
    text-align:center; font-size:10px; font-weight:bold;
    line-height:1.15; color:#222; border-radius:3px;
  }
  /* chairs around tables drawn as pseudo blocks */
  .table .seat-top,.table .seat-bottom,.table .seat-left,.table .seat-right{
    position:absolute; display:flex; gap:3px;
  }
  .table .seat-top{ top:-9px; left:0; right:0; justify-content:center; }
  .table .seat-bottom{ bottom:-9px; left:0; right:0; justify-content:center; }
  .table .seat-left{ left:-9px; top:0; bottom:0; flex-direction:column; justify-content:center; }
  .table .seat-right{ right:-9px; top:0; bottom:0; flex-direction:column; justify-content:center; }
  .tchair{ width:10px; height:7px; background:#fff; border:1px solid #555; border-radius:2px; }
  .tchair.v{ width:7px; height:10px; }

  /* VIP rectangular tables (wide) */
  .vip-wide{ width:108px; height:56px; font-size:11px; }
  /* VIP tall tables (around ring) */
  .vip-tall{ width:58px; height:82px; font-size:11px; }
  /* Judges tables */
  .judges-h{ width:150px; height:34px; background:#e4e8ee; }
  .judges-v{ width:34px; height:150px; background:#e4e8ee; }
  .judges-v span{ writing-mode:vertical-rl; transform:rotate(180deg); letter-spacing:1px; }

  /* ---------- Boxing ring ---------- */
  .ring{
    position:absolute;
    width:236px; height:236px;
    left:632px; top:307px;
    background:#fff;
    border:3px solid #000;
    display:flex; align-items:center; justify-content:center;
    text-align:center; font-weight:bold; font-size:15px; line-height:1.4;
  }
  /* ropes */
  .ring::before,.ring::after{
    content:""; position:absolute; inset:10px;
    border:1.5px solid #444;
  }
  .ring::after{ inset:18px; border-color:#888; }
  .ring .ring-label{ position:relative; z-index:2; background:rgba(255,255,255,.65); padding:4px 8px; }
  /* corner posts */
  .post{ position:absolute; width:14px; height:14px; background:#000; border-radius:50%; z-index:3; }
  .post.tl{ left:-7px; top:-7px;} .post.tr{ right:-7px; top:-7px;}
  .post.bl{ left:-7px; bottom:-7px;} .post.br{ right:-7px; bottom:-7px;}

  /* ---------- Legend ---------- */
  .legend{
    max-width:1500px; margin:18px auto 0;
    display:flex; flex-wrap:wrap; gap:18px;
    font-size:13px; align-items:center;
    background:#fff; border:1px solid #ccc; border-radius:6px; padding:12px 16px;
  }
  .legend h2{ font-size:15px; margin:0 14px 0 0; }
  .legend .item{ display:flex; align-items:center; gap:6px; }
  .legend .swatch{ width:16px; height:16px; border:1px solid #333; border-radius:2px; }
  .legend .swatch.chair{ background:#fff; }
  .legend .swatch.table{ background:var(--table); border-color:#555; }
  .legend .swatch.judges{ background:#e4e8ee; border-color:#555; }
  .legend .swatch.exit{ background:#fff; border-color:#c0392b; }
  .title-bar{
    max-width:1500px; margin:0 auto 14px; text-align:center;
  }
  .title-bar h1{ margin:0; font-size:24px; letter-spacing:1px; }
  .title-bar p{ margin:4px 0 0; font-size:13px; color:#555; }
</style>
</head>
<body>

<div class="title-bar">
  <h1>EVENT SEATING PLAN — BOXING MATCH</h1>
  <p>150'-0" venue · 80 general rows × 20 chairs · VIP tables · 16'×16' ring</p>
</div>

<div class="sheet-wrap">
<div class="venue" id="venue">

  <div class="top-dim">|&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;150'-0"&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;|</div>

  <!-- EXITS -->
  <div class="exit" style="top:-15px; left:230px;">EXIT</div>
  <div class="exit" style="top:-15px; right:230px;">EXIT</div>
  <div class="exit" style="bottom:-15px; left:230px;">EXIT</div>
  <div class="exit" style="bottom:-15px; right:230px;">EXIT</div>
  <div class="exit" style="top:50%; left:-27px; transform:translateY(-50%) rotate(90deg);">EXIT</div>
  <div class="exit" style="top:50%; right:-27px; transform:translateY(-50%) rotate(90deg);">EXIT</div>

</div>
</div>

<div class="legend">
  <h2>LEGEND</h2>
  <div class="item"><span class="swatch chair"></span> General chair (20 per row)</div>
  <div class="item"><span class="swatch table"></span> VIP table</div>
  <div class="item"><span class="swatch judges"></span> Judges' table</div>
  <div class="item"><span class="swatch exit"></span> Emergency exit</div>
  <div class="item"><span class="swatch" style="background:#fff;border:2px solid #000;"></span> Boxing ring 16'×16'</div>
</div>

<script>
/* ----------------------------------------------------------
   Build the seating chart programmatically so the markup
   stays small and every block is identical & easy to tweak.
---------------------------------------------------------- */
const venue = document.getElementById('venue');

/* helper: build a chair element */
function chair(){ const c=document.createElement('div'); c.className='chair'; return c; }

/* Build one general-seating block.
   opts: {left, top, rows:[labels], caption, captionPos} */
function buildBlock(opts){
  const block=document.createElement('div');
  block.className='block';
  block.style.left=opts.left+'px';
  block.style.top=opts.top+'px';

  const leftN  = opts.leftN  ?? 10;   // chairs in the left group
  const rightN = opts.rightN ?? 10;   // chairs in the right group

  // top caption + column header (e.g. 20 CHAIRS PER ROW / 10 AISLE 10)
  if(opts.captionPos!=='bottom'){
    const cap=document.createElement('div'); cap.className='caption';
    cap.textContent=opts.caption; block.appendChild(cap);
    block.appendChild(colHead(leftN,rightN));
  }

  opts.rows.forEach(label=>{
    const row=document.createElement('div'); row.className='row';
    const rn=document.createElement('div'); rn.className='rownum'; rn.textContent=label;
    row.appendChild(rn);
    const left=document.createElement('div'); left.className='seats';
    const right=document.createElement('div'); right.className='seats';
    for(let i=0;i<leftN;i++) left.appendChild(chair());
    for(let i=0;i<rightN;i++) right.appendChild(chair());
    const aisle=document.createElement('div'); aisle.className='aisle';
    row.appendChild(left); row.appendChild(aisle); row.appendChild(right);
    block.appendChild(row);
  });

  if(opts.captionPos==='bottom'){
    block.appendChild(colHeadBottom(leftN,rightN));
    const cap=document.createElement('div'); cap.className='caption-bottom';
    cap.textContent=opts.caption; block.appendChild(cap);
  }
  venue.appendChild(block);
}

function colHead(leftN,rightN){
  const h=document.createElement('div'); h.className='col-head';
  h.style.paddingLeft='20px';
  h.innerHTML='<span>'+(leftN??10)+'</span><span>AISLE</span><span>'+(rightN??10)+'</span>';
  return h;
}
function colHeadBottom(leftN,rightN){
  const h=colHead(leftN,rightN); h.style.padding='4px 2px 0 20px'; return h;
}

/* General seating row labels — 10 bigger rows that fill the full height of each quadrant */
const rows10 = Array.from({length:10},(_,i)=>String(i+1));   // 10 rows per block

/* Top blocks start near the top wall and run down to 22px above the fire aisle;
   bottom blocks start 22px below it and run down toward the bottom wall. */
/* LEFT-TOP block (shifted left so first chair meets the fire-aisle's left end) */
buildBlock({left:40, top:37, rows:rows10, caption:'20 CHAIRS PER ROW'});
/* LEFT-BOTTOM block */
buildBlock({left:40, top:470, rows:rows10, caption:'20 CHAIRS PER ROW', captionPos:'bottom'});
/* RIGHT-TOP block (right group reduced to 5 → 10 + 5 = 15 per row) */
buildBlock({left:1140, top:37, rows:rows10, caption:'15 CHAIRS PER ROW', leftN:10, rightN:5});
/* RIGHT-BOTTOM block */
buildBlock({left:1140, top:470, rows:rows10, caption:'15 CHAIRS PER ROW', captionPos:'bottom', leftN:10, rightN:5});

/* ---------- FIRE AISLES ---------- */
function fireAisle(left,top,width){
  const f=document.createElement('div'); f.className='fire-aisle';
  f.style.left=left+'px'; f.style.top=top+'px'; f.style.width=width+'px'; f.style.height='46px';
  f.innerHTML='<div class="ttl">FIRE&nbsp;&nbsp;AISLE</div>'+
              '<div class="sub"><span class="arrow">◄</span> 6\'-0" WIDE <span class="arrow">►</span></div>';
  venue.appendChild(f);
}
fireAisle(60,402,368);
fireAisle(1160,402,283);

/* ---------- TABLES ---------- */
/* generic table builder with chairs around perimeter */
function makeTable(cls,label,topN,botN,leftN,rightN){
  const t=document.createElement('div'); t.className='table '+cls;
  if(cls==='judges-v'){ t.innerHTML='<span>'+label+'</span>'; }
  else { t.innerHTML=label; }
  const sides=[['seat-top',topN,false],['seat-bottom',botN,false],
               ['seat-left',leftN,true],['seat-right',rightN,true]];
  sides.forEach(([s,n,vert])=>{
    if(!n) return;
    const wrap=document.createElement('div'); wrap.className=s;
    for(let i=0;i<n;i++){ const c=document.createElement('div'); c.className='tchair'+(vert?' v':''); wrap.appendChild(c); }
    t.appendChild(wrap);
  });
  return t;
}
function placeTable(cls,label,x,y,t,b,l,r){
  const el=makeTable(cls,label,t,b,l,r);
  el.style.left=x+'px'; el.style.top=y+'px';
  venue.appendChild(el);
}

/* --- VIP wide tables: top band (3 cols x 2 rows) --- */
const topVipX=[546,696,846];
['VIP TABLE 1','VIP TABLE 2','VIP TABLE 3'].forEach((lbl,i)=>{
  placeTable('vip-wide',lbl,topVipX[i],95,4,4,0,0);   // row A
  placeTable('vip-wide',lbl,topVipX[i],165,4,4,0,0);  // row B
});
/* --- VIP wide tables: bottom band (3 cols x 2 rows) --- */
['VIP TABLE 1','VIP TABLE 2','VIP TABLE 3'].forEach((lbl,i)=>{
  placeTable('vip-wide',lbl,topVipX[i],640,4,4,0,0);
  placeTable('vip-wide',lbl,topVipX[i],710,4,4,0,0);
});

/* --- Judges' tables (top & bottom of ring, plus right side vertical) --- */
placeTable('judges-h',"JUDGES' TABLE",675,264,6,0,0,0);   // above ring
placeTable('judges-h',"JUDGES' TABLE",675,553,0,6,0,0);   // below ring
placeTable('judges-v',"JUDGES' TABLE",876,350,0,0,0,6);   // right of ring

/* --- VIP tall tables flanking the ring (left cluster) --- */
const leftRingX=[470,550];
const ringRowsY=[294,384,474];
ringRowsY.forEach((y,r)=>{
  leftRingX.forEach((x,c)=>{
    placeTable('vip-tall','VIP<br>TABLE '+(r+1),x,y,0,0,3,3);
  });
});
/* --- VIP tall tables flanking the ring (right cluster) --- */
const rightRingX=[950,1030];
ringRowsY.forEach((y,r)=>{
  rightRingX.forEach((x,c)=>{
    placeTable('vip-tall','VIP<br>TABLE '+(r+1),x,y,0,0,3,3);
  });
});

/* ---------- BOXING RING ---------- */
const ring=document.createElement('div'); ring.className='ring';
ring.innerHTML='<div class="ring-label">BOXING RING<br>16\' x 16\'</div>'+
               '<div class="post tl"></div><div class="post tr"></div>'+
               '<div class="post bl"></div><div class="post br"></div>';
venue.appendChild(ring);

/* ---------- Responsive scaling: fit the 1500px design to viewport ---------- */
function fit(){
  const wrap=document.querySelector('.sheet-wrap');
  const avail=wrap.clientWidth;
  const scale=Math.min(1, avail/1512);
  venue.style.transform='scale('+scale+')';
  // adjust wrapper height so scaled element doesn't leave gap
  wrap.style.height=(862*scale+30)+'px';
}
window.addEventListener('resize',fit); fit();
</script>

</body>
</html>
